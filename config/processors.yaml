# =========================================================================
# NOTAS DE USO
# =========================================================================
#
# Para DESENVOLVIMENTO (ver tudo):
#   screenshot_level: full
#   log_level: DEBUG
#
# Para DEPURAÇÃO DE ERROS (só problemas):
#   screenshot_level: errors-only
#   log_level: ERROR
#
# Para PRODUÇÃO (otimizado):
#   screenshot_level: milestones
#   log_level: INFO
#
# Para TESTES DE PERFORMANCE (mínimo):
#   enable_screenshots: false
#   enable_execution_logs: false
#
# =========================================================================

services:
  erp-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-automation
    restart: unless-stopped
    env_file:
      - /home/prospere/docker/shared.env
      - .env
    ports:
      - "6092:6092"
      - "5900:5900"   # x11vnc nativo (clientes RealVNC, TigerVNC, etc.)
      - "6080:6080"   # noVNC web (http://host:6080/vnc.html)
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config
      - ./temp:/app/temp
      - ./src:/app/src
      - ./scripts:/app/scripts
      # Destino dos .REM do robo de remessa. Mora FORA deste projeto de
      # proposito: quem consome os arquivos e o Financeiro (e, quando for
      # ligado, o job `enviar_remessas` do process-automation). O robo so
      # ESCREVE aqui — nunca le nem apaga o que ja esta na pasta.
      - /home/prospere/docker/automation/process-automation/tmp/remessas a enviar:/app/data/remessas_a_enviar
    environment:
      - DISPLAY=:99
      # VNC_PASSWORD vem do `.env` via env_file (fora do git). Nao reintroduzir
      # aqui: `environment:` sobrescreve `env_file:` e o valor iria pro repo.
      #
      # Role PROPRIA deste projeto desde 03/08/2026. Antes daqui `DB_USER` valia
      # `prospere`, que e SUPERUSUARIO do cluster e ignora qualquer permissao.
      #
      # ⚠️ Este projeto tem DOIS caminhos de credencial, e os dois entram aqui:
      #   DB_*        -> src/common/core/database.py, doc2you/baixar_dia.py,
      #                  robo_credito/config.py   (era `prospere`, SUPERUSUARIO)
      #   POSTGRES_*  -> src/processors/web/boletos/_db.py   (era `dev_user`)
      # Trocar so um deixaria metade do projeto sem atribuicao no log.
      #
      # ⛔ Aqui entra so a REFERENCIA `${...}`; o valor vem do `.env` local, que ja
      # esta fora do git. Nunca escreva o valor literal.
      #
      # Pre-voo: `app_erp_automation` alcanca os 7 objetos que o codigo usa
      # (`int.enriquecimento_sacado`, `operacional.boleto_*`, `stg.robo_analise_*`,
      # `trs.operacoes_desagio`) em leitura e escrita, e as 19 sequencias de
      # `int`/`operacional`/`stg`/`trs`.
      #
      # ROLLBACK: comentar as 4 linhas abaixo e `docker compose up -d`.
      - DB_USER=${APP_DB_USER}
      - DB_PASSWORD=${APP_DB_PASSWORD}
      - POSTGRES_USER=${APP_DB_USER}
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD}
    networks:
      - prospere-network
    shm_size: '2gb'
    command: ["/app/scripts/boot_vnc.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  prospere-network:
    external: true
